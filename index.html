<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Song List — Sunday 5 Oct</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%8E%B9</text></svg>">
<style>
  /* ---- Light (default, un-stamped) ---------------------------------- */
  :root {
    --paper:  #F6F6F4;   /* ground: neutral with a faint warm bias  */
    --surface:#FFFFFF;
    --ink:    #0D0E10;
    --ink-2:  #3D4045;   /* secondary text                          */
    --muted:  #8A8D91;   /* labels, notes                           */
    --rule:   #DCDCD8;
    --rule-2: #EAEAE6;   /* lighter hairline                        */
    --on-ink: #F6F6F4;   /* text on an ink-filled surface           */
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:  #0A0B0C;
      --surface:#121315;
      --ink:    #F0F0EC;
      --ink-2:  #C2C4C7;
      --muted:  #7E8185;
      --rule:   #26282B;
      --rule-2: #1B1D1F;
      --on-ink: #0A0B0C;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper:  #0A0B0C;
    --surface:#121315;
    --ink:    #F0F0EC;
    --ink-2:  #C2C4C7;
    --muted:  #7E8185;
    --rule:   #26282B;
    --rule-2: #1B1D1F;
    --on-ink: #0A0B0C;
    color-scheme: dark;
  }

  :root {
    --sans: "Helvetica Neue", Helvetica, Inter, ui-sans-serif, -apple-system,
            BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
            "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- Masthead ------------------------------------------------------ */
  .bar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px 24px;
    flex-wrap: wrap;
    padding: 14px 20px;
  }
  .brand {
    margin: 0;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.2;
    text-transform: uppercase;
    letter-spacing: .3em;
  }
  .brand span { display: block; font-weight: 400; letter-spacing: .22em; color: var(--muted); }

  .toggle {
    display: flex;
    border: 1px solid var(--rule);
    border-radius: 2px;
    overflow: hidden;
  }
  .toggle button {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .18em;
    color: var(--muted);
    background: transparent;
    border: 0;
    padding: 0 20px;
    min-height: 44px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .toggle button + button { border-left: 1px solid var(--rule); }
  .toggle button:hover { color: var(--ink); }
  .toggle button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ---- Page ---------------------------------------------------------- */
  .wrap { max-width: 1120px; margin: 0 auto; padding: 40px 20px 96px; }

  .song + .song { margin-top: 64px; padding-top: 56px; border-top: 1px solid var(--rule); }

  .head {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 10px 16px;
    margin-bottom: 28px;
  }
  .num {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    padding-top: 2px;
  }
  .song h2 {
    margin: 0;
    font-size: clamp(26px, 5vw, 42px);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -.005em;
    text-transform: uppercase;
    text-wrap: balance;
  }

  .head .meta {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .2em;
    color: var(--muted);
    margin-left: auto;
    white-space: nowrap;
  }


  .sheet { display: block; }
  .sec[hidden] { display: none; }
  .sec { break-inside: avoid; margin-bottom: 26px; }
  .sec-name {
    margin: 0 0 6px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .2em;
    color: var(--muted);
  }
  .sec-name .note {
    text-transform: none;
    letter-spacing: 0;
    font-weight: 400;
    font-style: italic;
  }

  pre {
    margin: 0;
    padding-left: 14px;
    border-left: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 19px;
    font-weight: 500;
    line-height: 1.75;
    letter-spacing: .01em;
    white-space: pre;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    font-variant-numeric: tabular-nums;
  }

  /* each line is its own block so a lyric can sit tight under its chords */
  pre .cl, pre .ly { display: block; }
  pre .ly {
    color: var(--ink-2);
    font-weight: 400;
    padding-bottom: .5em;
  }
  pre .ly:last-child { padding-bottom: 0; }

  /* lyric sheets set a touch smaller, and stay single-column until there is
     room for two — .sheet.wide outranks the .sheet column rules by specificity. */
  .sheet.wide { columns: 1; }
  .sheet.wide pre { font-size: 15px; line-height: 1.5; }
  @media (min-width: 760px)  { .sheet.wide pre { font-size: 17px; } }
  @media (min-width: 1100px) { .sheet.wide pre { font-size: 18px; } }

  /* ---- Flow ---------------------------------------------------------- */
  .flow { margin-top: 10px; padding-top: 18px; border-top: 1px solid var(--rule-2); }
  .flow p { margin: 0; }
  .flow .steps {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    align-items: baseline;
    font-size: 14px;
    color: var(--ink-2);
  }
  .flow .steps .sep { color: var(--muted); }

  @media (min-width: 760px) {
    body { font-size: 16px; }
    .wrap { padding: 52px 32px 112px; }
    pre { font-size: 21px; }
    .flow .steps { font-size: 15px; }
  }
  @media (min-width: 920px) {
    .sheet { columns: 2; column-gap: 56px; }
    .sheet.wide { columns: 2; column-gap: 48px; }
    .sec { margin-bottom: 30px; }
  }
  @media (min-width: 1100px) {
    pre { font-size: 23px; }
  }

  @media print {
    .bar { display: none; }
    .sheet, .sheet.wide { columns: 2; }
    .song + .song { break-before: page; }
  }
</style>

// degree, optional accidental, optional quality, optional bass.
// sevenths are superscript so 1⁷ never reads as "17".
const CHORD = /^([b♭#♯]?)([1-7])(maj⁷|sus4|sus2|add9|m⁷|m|⁷)?(?:\/([b♭#♯]?)([1-7]))?$/;
// bars, beat dots, dashes and repeat marks sit on chord lines but aren't chords
const MARKER = /^(\||•|-|×\d+(–\d+)?)$/;

// a line of nothing but chords and markers — lyrics are left alone
function isChordLine(line) {
  const toks = line.trim().split(/\s+/).filter(Boolean);
  return toks.length > 0 && toks.every((t) => CHORD.test(t) || MARKER.test(t));
}

// ---- Numbers → letters ------------------------------------------------
// keys are spelled the way their signature spells them, so the key of F
// reads Bb and the key of E reads F#. 12 keys, indexed by pitch class.
const KEY_PC = { C: 0, Db: 1, D: 2, Eb: 3, E: 4, F: 5, "F#": 6, G: 7, Ab: 8, A: 9, Bb: 10, B: 11 };
const KEY_ORDER = ["C", "Db", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
const KEY_LABEL = { Db: "D♭", Eb: "E♭", "F#": "F♯", Ab: "A♭", Bb: "B♭" };
const SCALES = {
  C:    ["C", "D", "E", "F", "G", "A", "B"],
  Db:   ["Db", "Eb", "F", "Gb", "Ab", "Bb", "C"],
  D:    ["D", "E", "F#", "G", "A", "B", "C#"],
  Eb:   ["Eb", "F", "G", "Ab", "Bb", "C", "D"],
  E:    ["E", "F#", "G#", "A", "B", "C#", "D#"],
  F:    ["F", "G", "A", "Bb", "C", "D", "E"],
  "F#": ["F#", "G#", "A#", "B", "C#", "D#", "F"],
  G:    ["G", "A", "B", "C", "D", "E", "F#"],
  Ab:   ["Ab", "Bb", "C", "Db", "Eb", "F", "G"],
  A:    ["A", "B", "C#", "D", "E", "F#", "G#"],
  Bb:   ["Bb", "C", "D", "Eb", "F", "G", "A"],
  B:    ["B", "C#", "D#", "E", "F#", "G#", "A#"],
};
const QUALITY = { "maj⁷": "maj7", "m⁷": "m7", "⁷": "7", m: "m", sus4: "sus4", sus2: "sus2", add9: "add9" };

function keyLabel(k) { return KEY_LABEL[k] || k; }

// a section may sit a few semitones above the song's key (an overtone lift)
function shiftKey(key, semitones) {
  return KEY_ORDER[(KEY_PC[key] + (semitones || 0) + 12) % 12];
}

// an accidental moves the scale note a semitone: D → Db, Bb → B, F# → F
function degree(key, acc, num) {
  const name = SCALES[key][Number(num) - 1];
  if (!acc) return name;
  if (acc === "b" || acc === "♭") {
    return name.endsWith("#") ? name.slice(0, -1) : name + "b";
  }
  return name.endsWith("b") ? name.slice(0, -1) : name + "#";
}

function toLetters(line, key) {
  const parts = line.split(/(\s+)/);
  const out = [];
  for (let i = 0; i < parts.length; i++) {
    const tok = parts[i];
    const m = tok.match(CHORD);
    if (!m) { out.push(tok); continue; }
    let name = degree(key, m[1], m[2]) + (m[3] ? QUALITY[m[3]] : "");
    if (m[5]) name += "/" + degree(key, m[4], m[5]);
    // keep the columns over the syllables: pad when shorter, borrow a space when longer
    if (name.length < tok.length) {
      name += " ".repeat(tok.length - name.length);
    } else if (name.length > tok.length) {
      const extra = name.length - tok.length;
      const next = parts[i + 1];
      if (next && /^\s+$/.test(next) && next.length > extra) {
        parts[i + 1] = next.slice(extra);
      }
    }
    out.push(name);
  }
  return out.join("");
}

// ---- Build ------------------------------------------------------------
const main = document.getElementById("songs");
const btnNum = document.getElementById("btn-num");
const btnKey = document.getElementById("btn-key");
const blocks = [];

SONGS.forEach((song, i) => {
  const art = document.createElement("article");
  art.className = "song";

  const head = document.createElement("div");
  head.className = "head";
  const num = document.createElement("span");
  num.className = "num";
  num.textContent = String(i + 1).padStart(2, "0");
  const h2 = document.createElement("h2");
  h2.textContent = song.title;
  head.appendChild(num);
  head.appendChild(h2);

  const meta = document.createElement("span");
  meta.className = "meta";
  meta.textContent = song.artist;
  head.appendChild(meta);

  art.appendChild(head);

  // every song carries lyrics, so the sheet runs full width
  const sheet = document.createElement("div");
  sheet.className = "sheet wide";

  song.sections.forEach((sec) => {
    const s = document.createElement("div");
    s.className = "sec";

    const name = document.createElement("p");
    name.className = "sec-name";
    name.textContent = sec.name;
    if (sec.note) {
      const n = document.createElement("span");
      n.className = "note";
      n.textContent = "  " + sec.note;
      name.appendChild(n);
    }
    s.appendChild(name);

    const pre = document.createElement("pre");
    s.appendChild(pre);
    blocks.push({ song: i, pre: pre, lines: sec.lines, shift: sec.shift || 0 });

    sheet.appendChild(s);
  });

  art.appendChild(sheet);

  if (!song.map) { main.appendChild(art); return; }

  const flow = document.createElement("div");
  flow.className = "flow";
  const flowName = document.createElement("p");
  flowName.className = "sec-name";
  flowName.textContent = "Flow";
  flow.appendChild(flowName);
  const steps = document.createElement("p");
  steps.className = "steps";
  song.map.forEach((step, j) => {
    if (j > 0) {
      const sep = document.createElement("span");
      sep.className = "sep";
      sep.textContent = "/";
      steps.appendChild(sep);
    }
    const sp = document.createElement("span");
    sp.textContent = step;
    steps.appendChild(sp);
  });
  flow.appendChild(steps);
  art.appendChild(flow);

  main.appendChild(art);
});

// ---- Render -----------------------------------------------------------
// Two views: scale numbers, or letters in the key this song is played in.
let mode = "numbers";

function render() {
  const letters = mode === "key";
  blocks.forEach((b) => {
    b.pre.textContent = "";
    const key = letters ? shiftKey(SONGS[b.song].key, b.shift) : null;
    b.lines.forEach((line) => {
      const chords = isChordLine(line);
      const row = document.createElement("span");
      row.className = chords ? "cl" : "ly";
      row.textContent = chords && key ? toLetters(line, key) : line;
      b.pre.appendChild(row);
    });
  });
  btnNum.setAttribute("aria-pressed", String(!letters));
  btnKey.setAttribute("aria-pressed", String(letters));
  try { localStorage.setItem("chartMode", mode); } catch (e) {}
}

function setMode(next) { mode = next; render(); }

btnNum.addEventListener("click", () => setMode("numbers"));
btnKey.addEventListener("click", () => setMode("key"));

try { mode = localStorage.getItem("chartMode") === "key" ? "key" : "numbers"; } catch (e) {}
render();
</script>

</body>
</html>

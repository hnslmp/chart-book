<style>
  /* ---- Light (default, un-stamped) ---------------------------------- */
  :root {
    --paper:  #F6F6F4;   /* ground: neutral with a faint warm bias  */
    --surface:#FFFFFF;
    --ink:    #0D0E10;
    --ink-2:  #3D4045;   /* secondary text                          */
    --muted:  #8A8D91;   /* labels, notes                           */
    --rule:   #DCDCD8;
    --rule-2: #EAEAE6;   /* lighter hairline                        */
    --on-ink: #F6F6F4;   /* text on an ink-filled surface           */
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:  #0A0B0C;
      --surface:#121315;
      --ink:    #F0F0EC;
      --ink-2:  #C2C4C7;
      --muted:  #7E8185;
      --rule:   #26282B;
      --rule-2: #1B1D1F;
      --on-ink: #0A0B0C;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper:  #0A0B0C;
    --surface:#121315;
    --ink:    #F0F0EC;
    --ink-2:  #C2C4C7;
    --muted:  #7E8185;
    --rule:   #26282B;
    --rule-2: #1B1D1F;
    --on-ink: #0A0B0C;
    color-scheme: dark;
  }

  :root {
    --sans: "Helvetica Neue", Helvetica, Inter, ui-sans-serif, -apple-system,
            BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
            "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- Masthead ------------------------------------------------------ */
  .bar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px 24px;
    flex-wrap: wrap;
    padding: 14px 20px;
  }
  .brand {
    margin: 0;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.2;
    text-transform: uppercase;
    letter-spacing: .3em;
  }
  .brand span { display: block; font-weight: 400; letter-spacing: .22em; color: var(--muted); }

  .toggle {
    display: flex;
    border: 1px solid var(--rule);
    border-radius: 2px;
    overflow: hidden;
  }
  .toggle button {
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .18em;
    color: var(--muted);
    background: transparent;
    border: 0;
    padding: 0 20px;
    min-height: 44px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .toggle button + button { border-left: 1px solid var(--rule); }
  .toggle button:hover { color: var(--ink); }
  .toggle button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ---- Song nav ------------------------------------------------------ */
  .nav {
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 73px);
    z-index: 9;
    background: var(--paper);
    border-bottom: 1px solid var(--rule-2);
    padding: 0 20px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .nav::-webkit-scrollbar { display: none; }
  .nav ol {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    gap: 0 4px;
    white-space: nowrap;
  }
  .nav a {
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
    min-height: 44px;
    padding: 12px 10px 10px;
    color: var(--muted);
    text-decoration: none;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .14em;
    border-bottom: 2px solid transparent;
    transition: color .15s ease, border-color .15s ease;
  }
  .nav a .n { font-family: var(--mono); font-weight: 400; letter-spacing: 0; font-size: 10px; }
  .nav a:hover { color: var(--ink); }
  .nav a[aria-current="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .song { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 140px); }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  /* tablets and up: wrap the titles instead of scrolling sideways */
  @media (min-width: 600px) {
    .nav { overflow-x: visible; }
    .nav ol { flex-wrap: wrap; white-space: normal; }
    .nav a { white-space: nowrap; }
  }
  @media (min-width: 760px) { .nav { padding: 0 32px; } .nav a { font-size: 12px; } }

  /* ---- Page ---------------------------------------------------------- */
  .wrap { max-width: 1120px; margin: 0 auto; padding: 40px 20px 96px; }

  .song + .song { margin-top: 64px; padding-top: 56px; border-top: 1px solid var(--rule); }

  .head {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 10px 16px;
    margin-bottom: 28px;
  }
  .num {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    padding-top: 2px;
  }
  .song h2 {
    margin: 0;
    font-size: clamp(25px, 5vw, 41px);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -.005em;
    text-transform: uppercase;
    text-wrap: balance;
  }

  /* the key the song is played in, sat right beside its title */
  .head .key {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    line-height: 1;
    color: var(--ink-2);
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 5px 8px;
    white-space: nowrap;
  }

  .head .meta {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .2em;
    color: var(--muted);
    margin-left: auto;
    white-space: nowrap;
  }


  .sheet { display: block; }
  .sec[hidden] { display: none; }
  .sec { break-inside: avoid; margin-bottom: 26px; }
  .sec-name {
    margin: 0 0 6px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .2em;
    color: var(--muted);
  }
  .sec-name .note {
    text-transform: none;
    letter-spacing: 0;
    font-weight: 400;
    font-style: italic;
  }

  pre {
    margin: 0;
    padding-left: 14px;
    border-left: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 19px;
    font-weight: 500;
    line-height: 1.75;
    letter-spacing: .01em;
    white-space: pre;
    overflow-x: hidden;
    font-variant-numeric: tabular-nums;
  }

  /* each line is its own block so a lyric can sit tight under its chords */
  pre .cl, pre .ly { display: block; }
  pre .ly {
    color: var(--ink-2);
    font-weight: 400;
    padding-bottom: .5em;
  }
  pre .ly:last-child { padding-bottom: 0; }

  /* lyric sheets set a touch smaller, and stay single-column until there is
     room for two — .sheet.wide outranks the .sheet column rules by specificity. */
  .sheet.wide { columns: 1; }
  .sheet.wide pre { font-size: 14px; line-height: 1.5; }
  @media (min-width: 760px)  { .sheet.wide pre { font-size: 16px; } }
  @media (min-width: 1100px) { .sheet.wide pre { font-size: 17px; } }

  /* ---- Flow ---------------------------------------------------------- */
  .flow { margin-top: 10px; padding-top: 18px; border-top: 1px solid var(--rule-2); }
  .flow p { margin: 0; }
  .flow .steps {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    align-items: baseline;
    font-size: 13px;
    color: var(--ink-2);
  }
  .flow .steps .sep { color: var(--muted); }

  @media (min-width: 760px) {
    body { font-size: 15px; }
    .wrap { padding: 52px 32px 112px; }
    pre { font-size: 21px; }
    .flow .steps { font-size: 14px; }
  }
  @media (min-width: 820px) {
    .sheet { columns: 2; column-gap: 56px; }
    .sheet.wide { columns: 2; column-gap: 40px; }
    .sec { margin-bottom: 30px; }
  }
  /* tablet portrait: two columns, so give the gutters back to the charts */
  @media (min-width: 820px) and (max-width: 1099px) {
    .wrap { padding: 44px 18px 96px; }
    .sheet.wide { column-gap: 26px; }
    .sheet.wide pre { padding-left: 10px; }
  }
  @media (min-width: 1100px) {
    pre { font-size: 23px; }
  }

  @media print {
    .bar, .nav { display: none; }
    .sheet, .sheet.wide { columns: 2; }
    .song + .song { break-before: page; }
  }
</style>

// degree, optional accidental, optional quality, optional bass.
// sevenths are superscript so 1⁷ never reads as "17".
const CHORD = /^([b♭#♯]?)([1-7])(maj⁷|sus4|sus2|add9|add2|m⁷|m|⁷)?(?:\/([b♭#♯]?)([1-7]))?$/;
// bars, beat dots, dashes and repeat marks sit on chord lines but aren't chords
const MARKER = /^(\||•|-|×\d+(–\d+)?)$/;

// a line of nothing but chords and markers — lyrics are left alone
function isChordLine(line) {
  const toks = line.trim().split(/\s+/).filter(Boolean);
  return toks.length > 0 && toks.every((t) => CHORD.test(t) || MARKER.test(t));
}

// ---- Numbers → letters ------------------------------------------------
// keys are spelled the way their signature spells them, so the key of F
// reads Bb and the key of E reads F#. 12 keys, indexed by pitch class.
const KEY_PC = { C: 0, Db: 1, D: 2, Eb: 3, E: 4, F: 5, "F#": 6, G: 7, Ab: 8, A: 9, Bb: 10, B: 11 };
const KEY_ORDER = ["C", "Db", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
const KEY_LABEL = { Db: "D♭", Eb: "E♭", "F#": "F♯", Ab: "A♭", Bb: "B♭" };
const SCALES = {
  C:    ["C", "D", "E", "F", "G", "A", "B"],
  Db:   ["Db", "Eb", "F", "Gb", "Ab", "Bb", "C"],
  D:    ["D", "E", "F#", "G", "A", "B", "C#"],
  Eb:   ["Eb", "F", "G", "Ab", "Bb", "C", "D"],
  E:    ["E", "F#", "G#", "A", "B", "C#", "D#"],
  F:    ["F", "G", "A", "Bb", "C", "D", "E"],
  "F#": ["F#", "G#", "A#", "B", "C#", "D#", "F"],
  G:    ["G", "A", "B", "C", "D", "E", "F#"],
  Ab:   ["Ab", "Bb", "C", "Db", "Eb", "F", "G"],
  A:    ["A", "B", "C#", "D", "E", "F#", "G#"],
  Bb:   ["Bb", "C", "D", "Eb", "F", "G", "A"],
  B:    ["B", "C#", "D#", "E", "F#", "G#", "A#"],
};
const QUALITY = { "maj⁷": "maj7", "m⁷": "m7", "⁷": "7", m: "m", sus4: "sus4", sus2: "sus2", add9: "add9", add2: "add2" };

function keyLabel(k) { return KEY_LABEL[k] || k; }

// a section may sit a few semitones above the song's key (an overtone lift)
function shiftKey(key, semitones) {
  return KEY_ORDER[(KEY_PC[key] + (semitones || 0) + 12) % 12];
}

// an accidental moves the scale note a semitone: D → Db, Bb → B, F# → F
function degree(key, acc, num) {
  const name = SCALES[key][Number(num) - 1];
  if (!acc) return name;
  if (acc === "b" || acc === "♭") {
    return name.endsWith("#") ? name.slice(0, -1) : name + "b";
  }
  return name.endsWith("b") ? name.slice(0, -1) : name + "#";
}

function toLetters(line, key) {
  const parts = line.split(/(\s+)/);
  const out = [];
  for (let i = 0; i < parts.length; i++) {
    const tok = parts[i];
    const m = tok.match(CHORD);
    if (!m) { out.push(tok); continue; }
    let name = degree(key, m[1], m[2]) + (m[3] ? QUALITY[m[3]] : "");
    if (m[5]) name += "/" + degree(key, m[4], m[5]);
    // keep the columns over the syllables: pad when shorter, borrow a space when longer
    if (name.length < tok.length) {
      name += " ".repeat(tok.length - name.length);
    } else if (name.length > tok.length) {
      const extra = name.length - tok.length;
      const next = parts[i + 1];
      if (next && /^\s+$/.test(next) && next.length > extra) {
        parts[i + 1] = next.slice(extra);
      }
    }
    out.push(name);
  }
  return out.join("");
}

// ---- Build ------------------------------------------------------------
const main = document.getElementById("songs");
const nav = document.getElementById("nav");
const btnNum = document.getElementById("btn-num");
const btnKey = document.getElementById("btn-key");
const blocks = [];

SONGS.forEach((song, i) => {
  const art = document.createElement("article");
  art.className = "song";
  art.id = "song-" + (i + 1);

  const li = document.createElement("li");
  const a = document.createElement("a");
  a.href = "#song-" + (i + 1);
  const an = document.createElement("span");
  an.className = "n";
  an.textContent = String(i + 1).padStart(2, "0");
  a.appendChild(an);
  a.appendChild(document.createTextNode(song.title));
  li.appendChild(a);
  nav.appendChild(li);

  const head = document.createElement("div");
  head.className = "head";
  const num = document.createElement("span");
  num.className = "num";
  num.textContent = String(i + 1).padStart(2, "0");
  const h2 = document.createElement("h2");
  h2.textContent = song.title;
  head.appendChild(num);
  head.appendChild(h2);

  const key = document.createElement("span");
  key.className = "key";
  key.textContent = keyLabel(song.key);
  key.setAttribute("aria-label", "Key of " + keyLabel(song.key));
  head.appendChild(key);

  const meta = document.createElement("span");
  meta.className = "meta";
  meta.textContent = song.artist;
  head.appendChild(meta);

  art.appendChild(head);

  // every song carries lyrics, so the sheet runs full width
  const sheet = document.createElement("div");
  sheet.className = "sheet wide";

  song.sections.forEach((sec) => {
    const s = document.createElement("div");
    s.className = "sec";

    const name = document.createElement("p");
    name.className = "sec-name";
    name.textContent = sec.name;
    if (sec.note) {
      const n = document.createElement("span");
      n.className = "note";
      n.textContent = "  " + sec.note;
      name.appendChild(n);
    }
    s.appendChild(name);

    const pre = document.createElement("pre");
    s.appendChild(pre);
    blocks.push({ song: i, pre: pre, lines: sec.lines, shift: sec.shift || 0 });

    sheet.appendChild(s);
  });

  art.appendChild(sheet);

  if (!song.map) { main.appendChild(art); return; }

  const flow = document.createElement("div");
  flow.className = "flow";
  const flowName = document.createElement("p");
  flowName.className = "sec-name";
  flowName.textContent = "Flow";
  flow.appendChild(flowName);
  const steps = document.createElement("p");
  steps.className = "steps";
  song.map.forEach((step, j) => {
    if (j > 0) {
      const sep = document.createElement("span");
      sep.className = "sep";
      sep.textContent = "/";
      steps.appendChild(sep);
    }
    const sp = document.createElement("span");
    sp.textContent = step;
    steps.appendChild(sp);
  });
  flow.appendChild(steps);
  art.appendChild(flow);

  main.appendChild(art);
});

// ---- Nav: mark the song currently in view ------------------------------
const navLinks = Array.from(nav.querySelectorAll("a"));
function setCurrent(id) {
  navLinks.forEach((l) => {
    const on = l.getAttribute("href") === "#" + id;
    if (on) l.setAttribute("aria-current", "true"); else l.removeAttribute("aria-current");
    if (on && l.scrollIntoView) l.scrollIntoView({ block: "nearest", inline: "nearest" });
  });
}
if ("IntersectionObserver" in window) {
  const seen = new Map();
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => seen.set(e.target.id, e.isIntersecting));
    const first = Array.from(main.querySelectorAll(".song")).find((el) => seen.get(el.id));
    if (first) setCurrent(first.id);
  }, { rootMargin: "-45% 0px -45% 0px" });
  main.querySelectorAll(".song").forEach((el) => io.observe(el));
}
setCurrent("song-1");

// anchors land below the sticky bar and nav, whatever height they wrap to
function setScrollOffset() {
  const h = document.querySelector(".bar").offsetHeight + nav.parentElement.offsetHeight + 16;
  main.querySelectorAll(".song").forEach((el) => { el.style.scrollMarginTop = h + "px"; });
}
setScrollOffset();
window.addEventListener("resize", function () { setScrollOffset(); fitBlocks(); });
// the mono face can land after first paint and change every measurement
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitBlocks);

// ---- Render -----------------------------------------------------------
// Two views: scale numbers, or letters in the key this song is played in.
let mode = "numbers";

function render() {
  const letters = mode === "key";
  blocks.forEach((b) => {
    b.pre.textContent = "";
    const key = letters ? shiftKey(SONGS[b.song].key, b.shift) : null;
    b.lines.forEach((line) => {
      const chords = isChordLine(line);
      const row = document.createElement("span");
      row.className = chords ? "cl" : "ly";
      row.textContent = chords && key ? toLetters(line, key) : line;
      b.pre.appendChild(row);
    });
  });
  btnNum.setAttribute("aria-pressed", String(!letters));
  btnKey.setAttribute("aria-pressed", String(letters));
  try { localStorage.setItem("chartMode", mode); } catch (e) {}
  fitBlocks();
}

// Chord columns only line up in a monospace block, so the lines cannot wrap.
// Shrink any block that would overflow its column until it fits.
// A song settles on one size for all of its blocks — the widest line decides.
// Sizing each block on its own would leave a two-column spread looking ragged.
const MIN_PX = 11;
function fitBlocks() {
  blocks.forEach((b) => { b.pre.style.fontSize = ""; b.pre.style.overflowX = ""; });
  const size = new Map();
  for (let pass = 0; pass < 3; pass++) {
    let tighter = false;
    blocks.forEach((b) => {
      const pre = b.pre;
      if (!pre.clientWidth || pre.scrollWidth <= pre.clientWidth) return;
      const now = parseFloat(getComputedStyle(pre).fontSize);
      const need = Math.max(MIN_PX, Math.floor(now * (pre.clientWidth / pre.scrollWidth) * 10) / 10);
      const cur = size.get(b.song);
      if (cur === undefined || need < cur) { size.set(b.song, need); tighter = true; }
    });
    if (!tighter) break;
    blocks.forEach((b) => {
      const s = size.get(b.song);
      if (s !== undefined) b.pre.style.fontSize = s + "px";
    });
  }
  // a block too long even at the floor keeps its scrollbar: clipping would
  // lose words, which is worse than the thing we are avoiding
  blocks.forEach((b) => {
    if (b.pre.scrollWidth > b.pre.clientWidth) b.pre.style.overflowX = "auto";
  });
}

function setMode(next) { mode = next; render(); }

btnNum.addEventListener("click", () => setMode("numbers"));
btnKey.addEventListener("click", () => setMode("key"));

try { mode = localStorage.getItem("chartMode") === "key" ? "key" : "numbers"; } catch (e) {}
render();
</script>

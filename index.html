<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Song List — CG Mon 28 Sep</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%8E%B9</text></svg>">
<style>
  /* ---- Light (default, un-stamped) ---------------------------------- */
  :root {
    --paper:  #F6F6F4;   /* ground: neutral with a faint warm bias  */
    --surface:#FFFFFF;
    --ink:    #0D0E10;
    --ink-2:  #3D4045;   /* secondary text                          */
    --muted:  #8A8D91;   /* labels, notes                           */
    --rule:   #DCDCD8;
    --rule-2: #EAEAE6;   /* lighter hairline                        */
    --on-ink: #F6F6F4;   /* text on an ink-filled surface           */
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:  #0A0B0C;
      --surface:#121315;
      --ink:    #F0F0EC;
      --ink-2:  #C2C4C7;
      --muted:  #7E8185;
      --rule:   #26282B;
      --rule-2: #1B1D1F;
      --on-ink: #0A0B0C;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper:  #0A0B0C;
    --surface:#121315;
    --ink:    #F0F0EC;
    --ink-2:  #C2C4C7;
    --muted:  #7E8185;
    --rule:   #26282B;
    --rule-2: #1B1D1F;
    --on-ink: #0A0B0C;
    color-scheme: dark;
  }

  :root {
    --sans: "Helvetica Neue", Helvetica, Inter, ui-sans-serif, -apple-system,
            BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
            "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- Masthead ------------------------------------------------------ */
  .bar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px 24px;
    flex-wrap: wrap;
    padding: 14px 20px;
  }
  .brand {
    margin: 0;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.2;
    text-transform: uppercase;
    letter-spacing: .3em;
  }
  .brand span { display: block; font-weight: 400; letter-spacing: .22em; color: var(--muted); }

  .toggle {
    display: flex;
    border: 1px solid var(--rule);
    border-radius: 2px;
    overflow: hidden;
  }
  .toggle button {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .18em;
    color: var(--muted);
    background: transparent;
    border: 0;
    padding: 0 20px;
    min-height: 44px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .toggle button + button { border-left: 1px solid var(--rule); }
  .toggle button:hover { color: var(--ink); }
  .toggle button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ---- Page ---------------------------------------------------------- */
  .wrap { max-width: 1120px; margin: 0 auto; padding: 40px 20px 96px; }

  .song + .song { margin-top: 64px; padding-top: 56px; border-top: 1px solid var(--rule); }

  .head {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 10px 16px;
    margin-bottom: 28px;
  }
  .num {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    padding-top: 2px;
  }
  .song h2 {
    margin: 0;
    font-size: clamp(26px, 5vw, 42px);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -.005em;
    text-transform: uppercase;
    text-wrap: balance;
  }

  .head .meta {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .2em;
    color: var(--muted);
    margin-left: auto;
    white-space: nowrap;
  }

  /* per-song key picker — only meaningful while chords are on screen */
  .keysel { display: flex; align-items: center; gap: 8px; }
  .keysel > span {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .2em;
    color: var(--muted);
  }
  .keysel select {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .08em;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 8px 10px;
    min-height: 40px;
    cursor: pointer;
  }
  body[data-mode="lyrics"] .keysel { display: none; }
  @media print { .keysel { display: none; } }

  .sheet { display: block; }
  .sec[hidden] { display: none; }
  .sec { break-inside: avoid; margin-bottom: 26px; }
  .sec-name {
    margin: 0 0 6px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .2em;
    color: var(--muted);
  }
  .sec-name .note {
    text-transform: none;
    letter-spacing: 0;
    font-weight: 400;
    font-style: italic;
  }

  pre {
    margin: 0;
    padding-left: 14px;
    border-left: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 19px;
    font-weight: 500;
    line-height: 1.75;
    letter-spacing: .01em;
    white-space: pre;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    font-variant-numeric: tabular-nums;
  }

  /* each line is its own block so a lyric can sit tight under its chords */
  pre .cl, pre .ly { display: block; }
  pre .ly {
    color: var(--ink-2);
    font-weight: 400;
    padding-bottom: .5em;
  }
  pre .ly:last-child { padding-bottom: 0; }

  /* songs that carry lyrics run full width and a touch smaller.
     .sheet.wide outranks the .sheet column rules below on specificity. */
  .sheet.wide { columns: 1; }
  .sheet.wide pre { font-size: 15px; line-height: 1.5; }
  @media (min-width: 760px)  { .sheet.wide pre { font-size: 17px; } }
  @media (min-width: 1100px) { .sheet.wide pre { font-size: 18px; } }

  /* ---- Flow ---------------------------------------------------------- */
  .flow { margin-top: 10px; padding-top: 18px; border-top: 1px solid var(--rule-2); }
  .flow p { margin: 0; }
  .flow .steps {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    align-items: baseline;
    font-size: 14px;
    color: var(--ink-2);
  }
  .flow .steps .sep { color: var(--muted); }

  @media (min-width: 760px) {
    body { font-size: 16px; }
    .wrap { padding: 52px 32px 112px; }
    pre { font-size: 21px; }
    .flow .steps { font-size: 15px; }
  }
  @media (min-width: 920px) {
    .sheet { columns: 2; column-gap: 56px; }
    .sec { margin-bottom: 30px; }
  }
  @media (min-width: 1100px) {
    pre { font-size: 23px; }
  }

  @media print {
    .bar { display: none; }
    .sheet { columns: 2; }
    .song + .song { break-before: page; }
  }
</style>
</head>
<body>
<header class="bar">
  <h1 class="brand">Song List<span>CG Mon 28 Sep</span></h1>
  <div class="toggle" role="group" aria-label="Chart display">
    <button id="btn-lyric" type="button" aria-pressed="true">Lyrics</button>
    <button id="btn-num" type="button" aria-pressed="false">Chords</button>
  </div>
</header>

<div class="wrap">
  <main id="songs"></main>
</div>

<script>
const SONGS = [
  {
    title: "Hari Ini Kurasa Bahagia",
    artist: "Maranatha Singers", key: "F",
    sections: [
      { name: "Intro", note: "×2 bass only, then ×2 full band", lines: [
        "| 1 • 4 • | 1 • 4 • |",
        "| 1 • 2m • | 3m • 4 • |",
        "| 1 • 2m • | 3m • 4 • |",
      ]},
      { name: "Verse", note: "same for both verses", lines: [
        "1 5          4          1",
        "Ha-ri ini ku rasa bahagia",
        "      6m              2      5",
        "Berkumpul bersama saudara seiman",
        "1 5                4         1",
        "Tu-han Yesus telah satukan kita",
        "      6m           4  5     1 5",
        "Tanpa memandang di antara kita.",
      ]},
      { name: "Pre-Chorus", lines: [
        "5       1",
        "Bergandengan tangan",
        "  5           4          1",
        "Dalam kasih dalam satu hati",
        "1 - 7 - 6m          2           5",
        "Ber-ja-lan dalam terang kasih Tuhan",
      ]},
      { name: "Chorus", lines: [
        "4     5       3m     6m",
        "Kau sahabatku kau saudaraku",
        "      4            5          1 1⁷",
        "Tiada yang dapat memisahkan kita",
        "4     5       3m     6m",
        "Kau sahabatku kau saudaraku",
        "      2m           5          1",
        "Tiada yang dapat memisahkan kita.",
      ]},
      { name: "Instrumental", lines: [
        "| 1 • 2m • | 3m • 4 • |",
        "| 1 • 2m • | 3m • 4 • |",
      ]},
      { name: "Chorus (overtone)", shift: 2, note: "×2, key up a whole step — numbers read against the new key", lines: [
        "4                5/4",
        "Kau, kau, kau sahabatku",
        "(Kau, kau, kau, kau, kau sahabatku)",
        "5         3m     6m",
        "Kau, kau, kau saudaraku",
        "(Kau, kau, kau, kau, kau sahabatku)",
        "      4             5         1 1⁷",
        "Tiada yang dapat memisahkan kita.",
      ]},
      { name: "Ending", shift: 2, note: "still against the raised key", lines: [
        "1m       2m           5          1",
        "   Tiada yang dapat memisahkan kita",
        "1m       2m           5          1",
        "   Tiada yang dapat memisahkan kita.",
      ]},
    ],
    map: [
      "Intro", "Verse 1", "Pre-Chorus", "Chorus", "Instrumental",
      "Verse 2", "Pre-Chorus", "Chorus", "Pre-Chorus", "Chorus",
      "Chorus (overtone) ×2 — ½ step... whole step up", "Ending",
    ],
  },
  {
    title: "Ku Kagum Akan Engkau",
    artist: "GMS Live", key: "Bb",
    sections: [
      { name: "Verse 1", lines: [
        "1       4m/1",
        "Kukagum akan Engkau",
        "1/3           6m",
        "Kau Raja yang mulia",
        "4        3m",
        "Terindah termegah",
        "   2m         5",
        "Pujian ku berikan",
      ]},
      { name: "Verse 2", lines: [
        "1        4m/1",
        "Kau buat ku terpana",
        "1/3         6m",
        "KaryaMu tak ternilai",
        "4               3m",
        "Kau Tuhan Sang Pencipta",
        "   2m        5",
        "Layak diagungkan",
      ]},
      { name: "Chorus", lines: [
        "1         3m",
        "Mulia Kau mulia",
        "    4            6m   5",
        "Kaulah Raja atas semesta",
        "1          3m",
        "Izinkan ku mendekat",
        " 4                  5          1",
        "Meninggikan seluruh bumi menyembah",
      ]},
    ],
    map: ["Verse 1", "Verse 2", "Chorus"],
  },
  {
    title: "Ku Kagum Hormat Akan Engkau",
    artist: "Gloria Trio", key: "A",
    sections: [
      { name: "Intro", lines: [
        "| 1   3m  4   5 | 6m  4   5  • |",
      ]},
      { name: "Verse", lines: [
        "          1",
        "Kau sungguh indah tiada taranya",
        "     4      5     1    5",
        "Sungguh menakjubkan",
        "     1                    1/3",
        "Sungguh ajaib 'tuk dimengerti",
        "  4                 2/♯4 5",
        "Lebih dari semua yang ada",
        "3/♭6     6m    3/♭6       5 2/♯4",
        " HikmatMu tiada terselami",
        "       4    2m           5",
        "KasihMu dalam 'tak terduga",
        "          1",
        "Kau sungguh indah tiada taranya",
        "     4      5     1 4 5",
        "Mulia dan berkuasa.",
      ]},
      { name: "Chorus", note: "×2", lines: [
        "     1       3m  4          5",
        "Ku kagum hormat akan Engkau",
        "     1       3m  4",
        "Ku kagum hormat akan Engkau",
        "       3/♭6     3     6m  5    2/♯4",
        "Kau Allah yang layak di - pu - ji",
        "     2m    5       1  4 5",
        "Ku kagum akan Engkau.",
      ]},
      { name: "Worshiping", lines: [
        "4     5    4        1            4   5",
        "  Aku kagum padaMu.. Yesus",
        "4 1            4           5",
        "  Kau melebihi apapun di dunia ini",
        "4         1",
        "  Hohowooo...",
      ]},
    ],
    map: ["Intro", "Verse", "Chorus ×2", "Worshiping"],
  },
];

// degree, optional accidental, optional quality, optional bass.
// sevenths are superscript so 1⁷ never reads as "17".
const CHORD = /^([b♭#♯]?)([1-7])(maj⁷|sus4|sus2|m⁷|m|⁷)?(?:\/([b♭#♯]?)([1-7]))?$/;
// bars, beat dots, dashes and repeat marks sit on chord lines but aren't chords
const MARKER = /^(\||•|-|×\d+(–\d+)?)$/;

// a line of nothing but chords and markers — lyrics are left alone
function isChordLine(line) {
  const toks = line.trim().split(/\s+/).filter(Boolean);
  return toks.length > 0 && toks.every((t) => CHORD.test(t) || MARKER.test(t));
}

// ---- Numbers → letters ------------------------------------------------
// keys are spelled the way their signature spells them, so the key of F
// reads Bb and the key of E reads F#. 12 keys, indexed by pitch class.
const KEY_PC = { C: 0, Db: 1, D: 2, Eb: 3, E: 4, F: 5, "F#": 6, G: 7, Ab: 8, A: 9, Bb: 10, B: 11 };
const KEY_ORDER = ["C", "Db", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
const KEY_LABEL = { Db: "D♭", Eb: "E♭", "F#": "F♯", Ab: "A♭", Bb: "B♭" };
const SCALES = {
  C:    ["C", "D", "E", "F", "G", "A", "B"],
  Db:   ["Db", "Eb", "F", "Gb", "Ab", "Bb", "C"],
  D:    ["D", "E", "F#", "G", "A", "B", "C#"],
  Eb:   ["Eb", "F", "G", "Ab", "Bb", "C", "D"],
  E:    ["E", "F#", "G#", "A", "B", "C#", "D#"],
  F:    ["F", "G", "A", "Bb", "C", "D", "E"],
  "F#": ["F#", "G#", "A#", "B", "C#", "D#", "F"],
  G:    ["G", "A", "B", "C", "D", "E", "F#"],
  Ab:   ["Ab", "Bb", "C", "Db", "Eb", "F", "G"],
  A:    ["A", "B", "C#", "D", "E", "F#", "G#"],
  Bb:   ["Bb", "C", "D", "Eb", "F", "G", "A"],
  B:    ["B", "C#", "D#", "E", "F#", "G#", "A#"],
};
const QUALITY = { "maj⁷": "maj7", "m⁷": "m7", "⁷": "7", m: "m", sus4: "sus4", sus2: "sus2" };

function keyLabel(k) { return KEY_LABEL[k] || k; }

// a section may sit a few semitones above the song's key (an overtone lift)
function shiftKey(key, semitones) {
  return KEY_ORDER[(KEY_PC[key] + (semitones || 0) + 12) % 12];
}

// an accidental moves the scale note a semitone: D → Db, Bb → B, F# → F
function degree(key, acc, num) {
  const name = SCALES[key][Number(num) - 1];
  if (!acc) return name;
  if (acc === "b" || acc === "♭") {
    return name.endsWith("#") ? name.slice(0, -1) : name + "b";
  }
  return name.endsWith("b") ? name.slice(0, -1) : name + "#";
}

function toLetters(line, key) {
  const parts = line.split(/(\s+)/);
  const out = [];
  for (let i = 0; i < parts.length; i++) {
    const tok = parts[i];
    const m = tok.match(CHORD);
    if (!m) { out.push(tok); continue; }
    let name = degree(key, m[1], m[2]) + (m[3] ? QUALITY[m[3]] : "");
    if (m[5]) name += "/" + degree(key, m[4], m[5]);
    // keep the columns over the syllables: pad when shorter, borrow a space when longer
    if (name.length < tok.length) {
      name += " ".repeat(tok.length - name.length);
    } else if (name.length > tok.length) {
      const extra = name.length - tok.length;
      const next = parts[i + 1];
      if (next && /^\s+$/.test(next) && next.length > extra) {
        parts[i + 1] = next.slice(extra);
      }
    }
    out.push(name);
  }
  return out.join("");
}

// ---- Build ------------------------------------------------------------
const main = document.getElementById("songs");
const btnLyric = document.getElementById("btn-lyric");
const btnNum = document.getElementById("btn-num");
const blocks = [];
// "numbers", or one of KEY_ORDER — chosen per song
const chosen = SONGS.map((s) => {
  try { return localStorage.getItem("songKey:" + s.title) || "numbers"; } catch (e) { return "numbers"; }
});

SONGS.forEach((song, i) => {
  const art = document.createElement("article");
  art.className = "song";

  const head = document.createElement("div");
  head.className = "head";
  const num = document.createElement("span");
  num.className = "num";
  num.textContent = String(i + 1).padStart(2, "0");
  const h2 = document.createElement("h2");
  h2.textContent = song.title;
  head.appendChild(num);
  head.appendChild(h2);

  const meta = document.createElement("span");
  meta.className = "meta";
  meta.textContent = song.artist;
  head.appendChild(meta);

  const label = document.createElement("label");
  label.className = "keysel";
  const cap = document.createElement("span");
  cap.textContent = "Key";
  const sel = document.createElement("select");
  sel.setAttribute("aria-label", "Key for " + song.title);
  const optNum = document.createElement("option");
  optNum.value = "numbers";
  optNum.textContent = "Numbers";
  sel.appendChild(optNum);
  KEY_ORDER.forEach((k) => {
    const o = document.createElement("option");
    o.value = k;
    o.textContent = keyLabel(k) + (k === song.key ? "  (as written)" : "");
    sel.appendChild(o);
  });
  sel.value = chosen[i];
  sel.addEventListener("change", () => {
    chosen[i] = sel.value;
    try { localStorage.setItem("songKey:" + song.title, sel.value); } catch (e) {}
    render();
  });
  label.appendChild(cap);
  label.appendChild(sel);
  head.appendChild(label);

  art.appendChild(head);

  // every song carries lyrics, so the sheet runs full width
  const sheet = document.createElement("div");
  sheet.className = "sheet wide";

  song.sections.forEach((sec) => {
    const s = document.createElement("div");
    s.className = "sec";

    const name = document.createElement("p");
    name.className = "sec-name";
    name.textContent = sec.name;
    if (sec.note) {
      const n = document.createElement("span");
      n.className = "note";
      n.textContent = "  " + sec.note;
      name.appendChild(n);
    }
    s.appendChild(name);

    const pre = document.createElement("pre");
    s.appendChild(pre);
    // a section of nothing but chords has nothing to say in lyrics mode
    const hasLyrics = sec.lines.some((line) => !isChordLine(line));
    blocks.push({ song: i, sec: s, pre: pre, lines: sec.lines, shift: sec.shift || 0, hasLyrics: hasLyrics });

    sheet.appendChild(s);
  });

  art.appendChild(sheet);

  if (!song.map) { main.appendChild(art); return; }

  const flow = document.createElement("div");
  flow.className = "flow";
  const flowName = document.createElement("p");
  flowName.className = "sec-name";
  flowName.textContent = "Flow";
  flow.appendChild(flowName);
  const steps = document.createElement("p");
  steps.className = "steps";
  song.map.forEach((step, j) => {
    if (j > 0) {
      const sep = document.createElement("span");
      sep.className = "sep";
      sep.textContent = "/";
      steps.appendChild(sep);
    }
    const sp = document.createElement("span");
    sp.textContent = step;
    steps.appendChild(sp);
  });
  flow.appendChild(steps);
  art.appendChild(flow);

  main.appendChild(art);
});

// ---- Render -----------------------------------------------------------
let mode = "lyrics";

function render() {
  const lyrics = mode !== "chords";
  blocks.forEach((b) => {
    b.pre.textContent = "";
    b.sec.hidden = lyrics && !b.hasLyrics;
    const pick = chosen[b.song];
    const key = pick === "numbers" ? null : shiftKey(pick, b.shift);
    b.lines.forEach((line) => {
      const chords = isChordLine(line);
      if (chords && lyrics) return;
      const row = document.createElement("span");
      row.className = chords ? "cl" : "ly";
      row.textContent = chords && key ? toLetters(line, key) : line;
      b.pre.appendChild(row);
    });
  });
  document.body.dataset.mode = lyrics ? "lyrics" : "chords";
  btnLyric.setAttribute("aria-pressed", String(lyrics));
  btnNum.setAttribute("aria-pressed", String(!lyrics));
  try { localStorage.setItem("chartMode", lyrics ? "lyrics" : "chords"); } catch (e) {}
}

function setMode(next) { mode = next; render(); }

btnLyric.addEventListener("click", () => setMode("lyrics"));
btnNum.addEventListener("click", () => setMode("chords"));

try { mode = localStorage.getItem("chartMode") === "chords" ? "chords" : "lyrics"; } catch (e) {}
render();
</script>

</body>
</html>
